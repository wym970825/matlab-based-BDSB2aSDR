<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BDS-3 B2a Software Receiver</title>
  <link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo-img" src="assets/icon.jpg" alt="B2a" width="48" height="48" />
        <div>
          <h1>BDS-3 B2a 软件接收机</h1>
          <p class="sub">科研用配置台 · IF 探针 · 捕获 / 跟踪 / 定位 · MATLAB 后台批处理</p>
        </div>
      </div>
      <div class="top-meta">
        <span id="verBadge" class="badge">v—</span>
        <span id="matlabBadge" class="badge badge-warn">MATLAB …</span>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="main">
      <section class="panel">
        <div id="tabPanels"></div>
        <div class="actions">
          <button type="button" id="btnReset" class="btn ghost">恢复默认</button>
          <button type="button" id="btnExport" class="btn ghost">导出 JSON</button>
          <button type="button" id="btnProbe" class="btn probe">运行 IF 探针</button>
          <button type="button" id="btnRun" class="btn primary">运行全流程</button>
        </div>
      </section>

      <aside class="side">
        <div class="card">
          <h2>运行状态</h2>
          <div class="status-row">
            <span class="k">Job</span>
            <span id="jobId" class="v mono">—</span>
          </div>
          <div class="status-row">
            <span class="k">类型</span>
            <span id="jobKind" class="v">—</span>
          </div>
          <div class="status-row">
            <span class="k">状态</span>
            <span id="jobStatus" class="v"><span class="pill idle">idle</span></span>
          </div>
          <div class="status-row">
            <span class="k">输出</span>
            <span id="jobOut" class="v mono small">—</span>
          </div>
          <div class="status-row">
            <span class="k">定位</span>
            <span id="jobNav" class="v">—</span>
          </div>
          <div class="progress"><div id="progressBar" class="bar"></div></div>
          <div class="side-actions">
            <button type="button" id="btnOpen" class="btn ghost" disabled>打开结果</button>
            <button type="button" id="btnRefresh" class="btn ghost">刷新状态</button>
          </div>
        </div>
        <div class="card log-card">
          <h2>MATLAB 日志</h2>
          <pre id="logView" class="log"></pre>
        </div>
      </aside>
    </main>

    <footer class="foot">
      图标：<code>python/b2a_ui/icon</code> · 探针基于 <code>probeData</code> 思路生成时域/频谱图 ·
      MATLAB 干净环境 <code>-batch</code> · 可选 <code>B2A_MATLAB</code>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
